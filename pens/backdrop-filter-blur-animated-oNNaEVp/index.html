  <title>backdrop-filter: blur() (animated)</title>
  
  
  
  
<style>
@keyframes backdrop-filter-animation {
  from {
    backdrop-filter: blur(30px) saturate(160%) brightness(130%);
  }
  50% {
    backdrop-filter: blur(10px) saturate(160%) brightness(130%);
  }
  to {
    backdrop-filter: blur(30px) saturate(160%) brightness(130%);
  }
}
.app-bar {
  -webkit-backdrop-filter: blur(30px) saturate(160%) brightness(130%);
  animation: backdrop-filter-animation 3s ease infinite;
  background: rgba(39, 39, 39, 0.3);
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: background-color 0.3s ease;
  display: flex;
  justify-content: center;
  align-items: center;
  position: sticky;
  top: 0;
  width: 100vw;
  height: 60px;
}
@media (hover) {
  .app-bar:hover {
    background: rgba(218, 39, 39, 0.3);
  }
}
.app-content {
  -webkit-backdrop-filter: blur(30px) saturate(160%) brightness(130%);
  animation: backdrop-filter-animation 3s ease infinite;
  background: rgba(39, 39, 39, 0.3);
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: background-color 0.3s ease;
  position: sticky;
  top: 150px;
  width: 600px;
  height: 400px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
}
@media (hover) {
  .app-content:hover {
    background: rgba(218, 39, 39, 0.3);
  }
}
.app-footer {
  -webkit-backdrop-filter: blur(30px) saturate(160%) brightness(130%);
  animation: backdrop-filter-animation 3s ease infinite;
  background: rgba(39, 39, 39, 0.3);
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: background-color 0.3s ease;
  display: flex;
  justify-content: center;
  align-items: center;

}
