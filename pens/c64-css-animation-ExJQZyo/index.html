<style>
:root {
  --color-primary: white;
  --color-surface: #111;
}

@-webkit-keyframes c-animation {
  from {
    --saturation: 0%;
    --lightness: 100%;
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
  to {
    --saturation: 100%;
    --lightness: 50%;
    opacity: 1;
  }
}

@keyframes c-animation {
  from {
    --saturation: 0%;
    --lightness: 100%;
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
  to {
    --saturation: 100%;
    --lightness: 50%;
    opacity: 1;
  }
}
@layer scene {
  .scene {
    display: grid;
    place-items: center;
    position: absolute;
    inset: 0;
    perspective: 50rem;
    --rotate-z: 87deg;
    --inner-radius: 20vmin;
    --item-size: 4vmin;
    --ring-gap: calc(var(--item-size) + .6vmin);
    --depth: 3;
    --border-radius: 1.2vmin;
    --flag-row-gap: .2vmin;
    filter: drop-shadow(0 0 4rem black);
    --saturation: 0%;
    --lightness: 100%;
    -webkit-animation: c-animation 0.001s 9.5s linear forwards;
            animation: c-animation 0.001s 9.5s linear forwards;
  }

  .logo {
    position: absolute;
    -webkit-animation: rotate-logo 10s ease infinite;
            animation: rotate-logo 10s ease infinite;
    transform-style: preserve-3d;
  }

  @-webkit-keyframes rotate-logo {
    from {
      transform: rotateY(0deg);
    }
    to {
      transform: rotateY(360deg);
    }
  }

  @keyframes rotate-logo {
    from {
      transform: rotateY(0deg);
    }
    to {
      transform: rotateY(360deg);
    }
  }
}
@property --saturation {
  syntax: "<percentage>";
  initial-value: 0%;
  inherits: true;
}
@property --lightness {
  syntax: "<percentage>";
  initial-value: 0%;
  inherits: true;
}
@layer c {
  .c {
    transform: rotateZ(var(--rotate-z));
    display: grid;
    place-items: center;
    transform-style: preserve-3d;
  }

  @-webkit-keyframes cube-animation {
    from {
      opacity: 0;
      scale: 2.5;
    }
    to {
      opacity: 1;
      scale: 1;
    }
  }

  @keyframes cube-animation {
    from {
      opacity: 0;
      scale: 2.5;
    }
    to {
      opacity: 1;
      scale: 1;
    }
  }
  .cube {
    position: absolute;
    --width: var(--item-size);
    --width-n: calc(var(--item-size) * -1);
    --height: calc(var(--item-size) * var(--depth));
    --height-half: calc(var(--height) / 2);
    --height-half-n: calc(var(--height) / -2);
    width: var(--width);
    height: var(--width);
    --offset-per-item: calc(360deg / (var(--count) + 17 + var(--ring-index) * 5.5));
    --angle: calc(var(--offset-per-item) * var(--item-index));
    --radius: calc(var(--inner-radius) + (var(--ring-gap) * var(--ring-index)));
    --x: calc(cos(var(--angle)) * var(--radius));
    --y: calc(sin(var(--angle)) * var(--radius));
    transform: translate3d(var(--x), var(--y), 0) rotate3d(0, 0, 1, var(--angle));
    transform-style: preserve-3d;
    transform-origin: var(--pos);
  }
  .cube > div {
    --z: calc(var(--width) / 2);
    transform-style: preserve-3d;
    width: var(--width);
    height: var(--width);
    position: absolute;
    border-radius: var(--border-radius);
    opacity: 0;
    --duration: .5s;
    --delay: calc(.02s * (var(--ring-index) + 1) * (var(--item-index) + 1));
    -webkit-animation: cube-animation var(--duration) var(--delay, 0s) ease forwards, bg 10s 5s linear infinite;
            animation: cube-animation var(--duration) var(--delay, 0s) ease forwards, bg 10s 5s linear infinite;
    --a: .45;
    --circle-size: .1vmin;
    background: repeating-conic-gradient(from 45deg, hsla(208, var(--saturation), calc(var(--lightness) + var(--ring-index) * 10%), 0.4) 1%, transparent 40%);
  }
  .cube > div.front {
    transform: translate3d(0, 0, var(--height-half));
  }
  .cube > div.back {
    transform: translate3d(0, 0, var(--height-half-n));
  }
  .cube > div.top {
    height: var(--height);
    transform: rotate3d(1, 0, 0, 90deg) translate3d(0, 0, var(--height-half));
  }
  .cube > div.bottom {
    height: var(--height);
    transform-origin: top;
    transform: rotate3d(1, 0, 0, -90deg) translate3d(0, var(--height-half-n), var(--width));
  }
  .cube > div.right {
    width: var(--height);
    --z: calc(var(--height-half-n) + var(--width));
    transform: rotate3d(0, 1, 0, 90deg) translate3d(0, 0, var(--z));
  }
  .cube > div.left {
    width: var(--height);
    --z: calc(var(--height-half));
    transform: rotate3d(0, 1, 0, -90deg) translate3d(0, 0, var(--z));
  }
  .cube > div.front {
    --color: hsla(0, 100%, 50%, var(--a, 1));
    --c: 0;
  }
  .cube > div.right {
    --color: hsla(60, 100%, 50%, var(--a));
    --c: 10;
  }
  .cube > div.back {
    --color: hsla(120, 100%, 50%, var(--a));
    --c: 20;
  }
  .cube > div.left {
    --color: hsla(180, 100%, 50%, var(--a));
    --c: 30;
  }
  .cube > div.top {
    --color: hsla(240, 100%, 50%, var(--a));
    --c: 40;
  }
  .cube > div.bottom {
    --color: hsla(300, 100%, 50%, var(--a));
    --c: 50;
  }
}
@layer flag {
  .flag {
    position: absolute;
    display: flex;
    flex-direction: column;
    transform-style: preserve-3d;
    translate: 2vmin -17vmin;
    gap: var(--flag-row-gap, 0);
  }
  .flag .row {
    height: var(--item-size);
    display: flex;
    transform-style: preserve-3d;
    gap: 0.4vmin;
  }
  .flag .row:nth-child(4) {
    margin-bottom: 0.2vmin;
  }
  .flag .row:nth-child(5) {
    margin-top: 0.2vmin;
  }
  .flag .row:nth-child(n+5) .cube > div {
    background: repeating-radial-gradient(60% 60% at 0 0, hsla(8, var(--saturation), var(--lightness), 0.4) 1%, transparent 40%);
  }
  .flag .cube {
    position: relative;
    transform: unset;
  }
}
body {
  width: 100vw;

}

a.labs-follow-me {
  -webkit-backdrop-filter: blur(1rem);
          backdrop-filter: blur(1rem);
  left: 2rem;
  right: 2rem;
  bottom: 1rem;
  top: unset;
  text-align: center;
  display: grid;
  place-items: center;
  --bg: linear-gradient(to bottom, transparent, #EA282E, transparent, transparent, transparent, transparent, #EF6946, transparent, transparent, transparent, transparent, #FDCF1B, transparent, transparent, transparent, transparent, #50BA49, transparent, transparent, transparent, transparent, #01A7EE, transparent, transparent, transparent, transparent);
}
a.labs-follow-me:before, a.labs-follow-me:after {
  content: "";
  position: absolute;
  width: 10vmin;

  left: -4vmin;

  transform: scaleY(1.5);
}
a.labs-follow-me:after {
  left: unset;
  right: -4vmin;
}

* {
  box-sizing: border-box;
}
