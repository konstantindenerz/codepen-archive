<!DOCTYPE html>

  <title>AI Bot Credits Usage Animation</title>
  
  
  
  
<style>
@property --c {
  syntax: "<percentage>";
  inherits: true;
  initial-value: 110%;
}

@property --c2 {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}
@keyframes credits {
  to {
    --c: -10%;
    --c2: 1;
  }
}

:root {
  --primary: #00fcff;
  --secondary: #ff00e1;
}

.avatar {
  width: 30vmin;
  aspect-ratio: 1;
  animation: credits 3s linear infinite;
  clip-path: var(--shape);
  padding: 3vmin;
  background: color-mix(in srgb, var(--primary), black 70%);
  display: grid;
  place-items: center;
  position: relative;
  &:before {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(
      from 180deg,
      var(--primary) var(--c),
      var(--secondary) calc(var(--c) + 4%),
      transparent calc(var(--c) + 10%)
    );
  }
  /*   box-shadow: inset 10px 10px 4px black; */
  &:after {
    font-size: 4vmin;
    content: "⋆˙⟡";
    background: var(--primary);
    padding: 0.25rem 0.5rem;
    position: absolute;
    bottom: 0.25vmin;
    clip-path: var(--shape);
  }
}
img {
  width: 100%;
  object-fit: cover;
  clip-path: var(--shape);
}

.preview {
  position: relative;

  &:before, &:after {
z-index: 1;
    content: "";
    position: absolute;
    inset: 14vmin;
    translate: -4.25vmin -4.4vmin;
    aspect-ratio: 1;
    border-radius: 1rem;

    background: conic-gradient(var(--primary), transparent);
    animation: eye 3s linear infinite;
  }
  
  &:after { 
     translate: 3.25vmin -4.4vmin;
  }
}
@keyframes eye {
  from {
    rotate: 0;
  }
  
  50% {
    filter: blur(.2rem);
  }
    
  to {
    rotate: 360deg;
  }
  
}
body {
  height: 100dvh;
  display: grid;
  place-items: center;
  background: #111;
  filter: drop-shadow(
    0 0 12vmin
      color-mix(
        in srgb,
        var(--primary),
        transparent calc(40% + 50% * var(--c2))
      )
  );
  animation: credits 3s linear infinite;
}
