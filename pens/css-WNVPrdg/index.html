<!DOCTYPE html>
<html lang="en" >

<head>
  
  <meta charset="UTF-8">

  
  

  <title>🔥 (CSS)</title>
  
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  
  
<style>
@charset "UTF-8";
:root {
  --flame: "🔥";
}

body {
  height: 100vh;
  width: 100vw;
  background: radial-gradient(4vmin 1vmin at 50% calc(50% + 11vmin), #876e08, #3e1600, #000000 1vmin, transparent 2vmin), conic-gradient(at 50% calc(50% + 10vmin), #2a2a2a, black, #2a2a2a);
  position: relative;
  font-size: 20vmin;
  overflow: hidden;
  filter: drop-shadow(0 0 10rem orange);
}
body:before {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  content: var(--flame);
  --start: 1;
  --end: -1;
  filter: blur(0.1rem);
  -webkit-animation: fire 0.01s 0.05s ease-out infinite;
          animation: fire 0.01s 0.05s ease-out infinite;
}
body:after {
  position: absolute;
  inset: 0;
  display: grid;
  --start: -1;
  --end: 1;
  place-items: center;
  content: var(--flame);
  -webkit-animation: fire 0.01s ease-in infinite;
          animation: fire 0.01s ease-in infinite;
}

@-webkit-keyframes fire {
  from, to {
    transform: scaleX(var(--start));
  }
  50% {
    transform: scaleX(var(--end)) scaleY(1.2);
    opacity: 0.3;
    filter: blur(1rem) brightness(1.5) saturate(1.2);
  }
}

@keyframes fire {
  from, to {
    transform: scaleX(var(--start));
  }
  50% {
    transform: scaleX(var(--end)) scaleY(1.2);
    opacity: 0.3;
    filter: blur(1rem) brightness(1.5) saturate(1.2);
  }
}
</style>
