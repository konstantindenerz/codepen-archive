<!DOCTYPE html>

<head>

  <title>Additional Card Focus Marker #2</title>
  
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">

  
  
<style>
:root {
  --primary: #0083b4;
}

.card {
  --padding: 1.5rem;
  border-radius: 2rem;
  width: 60vmin;
  aspect-ratio: 4/2;
  background: rgba(0, 0, 0, 0.05);
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: var(--padding);
  position: relative;
  transition: all 0.3s ease;
  border: 1px solid transparent;
}
.card:has(.field:focus) {
  box-shadow: 0 0 1rem rgba(0, 0, 0, 0.2);
  border-color: var(--primary);
}
.card:has(.field:focus) .focus-marker {
  -webkit-animation: show-focus-maker 0.3s ease-out forwards;
          animation: show-focus-maker 0.3s ease-out forwards;
}

@-webkit-keyframes show-focus-maker {
  to {
    transform: scaleY(1);
    opacity: 1;
  }
}

@keyframes show-focus-maker {
  to {
    transform: scaleY(1);
    opacity: 1;
  }
}
@-webkit-keyframes hide-focus-maker {
  to {
    transform: scaleY(0);
  }
}
@keyframes hide-focus-maker {
  to {
    transform: scaleY(0);
  }
}
.focus-marker {
  width: 0.25rem;
  background: var(--primary);
  border-radius: 2rem;
  top: calc(var(--padding) * 2);
  bottom: calc(var(--padding) * 2);
  translate: calc(var(--padding) * -1 - .125rem);
  transform: scaleY(0);
  opacity: 0;
  position: absolute;
}

.field, .description {
  height: 2.5rem;
  width: 100%;
  background: rgba(0, 0, 0, 0.05);
  border-radius: 0.5rem;
  border: none;
  padding: 0.75rem;
  outline-color: var(--primary);
}

.description {
  height: 100%;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

* {
  box-sizing: border-box;
}

body {
  display: grid;
  place-items: center;
  background: #f1f1f1;
  height: 100dvh;
  width: 100dvw;
}
</style>

<body translate="no">

    <div class="description"></div>
  </div>
